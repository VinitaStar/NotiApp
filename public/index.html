<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#240b1d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Us" />
<title>Us 💛</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="hearts-bg" class="hearts-bg" aria-hidden="true"></div>

  <div class="app">
    <header class="brand">
      <h1>Us</h1>
      <p>little pings, across the distance</p>
    </header>

    <section id="person-screen" class="glass person-card">
      <p>Who's holding this phone?</p>
      <div class="person-choices">
        <button class="person-btn" data-person="me"><span>💗</span>I'm Vinita</button>
        <button class="person-btn" data-person="bae"><span>💛</span>I'm Sharvin</button>
      </div>
    </section>

    <main id="main-screen" class="hidden">
      <div class="topbar">
        <div id="who-am-i" class="chip"></div>
        <button id="enable-notifications" class="chip chip-btn">🔔 Enable notifications</button>
      </div>

      <section id="tab-ping" class="tab-content active">
        <div class="ping-grid">
          <button class="ping-btn" data-type="eating"><span class="ping-icon">🍽️</span>Eating</button>
          <button class="ping-btn" data-type="sleepy"><span class="ping-icon">😴</span>Sleepy</button>
          <button class="ping-btn" data-type="miss"><span class="ping-icon">🥺</span>Miss you</button>
          <button class="ping-btn" data-type="love"><span class="ping-icon">❤️</span>Love you</button>
          <button class="ping-btn" data-type="awake"><span class="ping-icon">☀️</span>Good morning</button>
          <button class="ping-btn" data-type="night"><span class="ping-icon">🌙</span>Goodnight</button>
        </div>
        <div class="custom-row">
          <input id="custom-input" type="text" placeholder="Write something sweet..." maxlength="200" />
          <button id="custom-send" class="send-btn" aria-label="Send">➤</button>
        </div>
      </section>

      <section id="tab-history" class="tab-content">
        <div id="history-list"></div>
      </section>

      <section id="tab-dates" class="tab-content">
        <div id="dates-list"></div>
      </section>

      <section id="tab-ask" class="tab-content">
        <div class="glass form-card">
          <textarea id="question-input" class="text-input" maxlength="300" placeholder="Ask something you've always wondered..."></textarea>
          <button id="question-send" class="primary-btn">Ask 💭</button>
          <p class="hint">If they don't answer, they'll get a gentle reminder 🔔</p>
        </div>
        <div id="questions-list"></div>
      </section>

      <section id="tab-places" class="tab-content">
        <div class="glass form-card">
          <div class="folder-row">
            <input id="place-folder" class="text-input" list="folder-options" placeholder="Folder (e.g. Eat, Visit)" maxlength="40" />
            <datalist id="folder-options"></datalist>
            <button id="folder-create" class="ghost-btn" type="button">+ Folder</button>
          </div>
          <input id="place-title" class="text-input" placeholder="Name (optional)" maxlength="100" />
          <input id="place-url" class="text-input" placeholder="Paste link here" />
          <button id="place-send" class="primary-btn">Add place 📍</button>
        </div>
        <div id="places-list"></div>
      </section>

      <section id="tab-meet" class="tab-content">
        <div id="meet-hero"></div>
        <div class="glass form-card">
          <p id="event-form-title" class="form-title">Add a countdown</p>
          <input id="event-title" class="text-input" placeholder="What are we waiting for? (e.g. Meet in KL)" maxlength="80" />
          <input id="event-at" class="text-input" type="datetime-local" />
          <div class="row">
            <button id="event-save" class="primary-btn">Add countdown ✈️</button>
            <button id="event-cancel" class="ghost-btn hidden" type="button">Cancel</button>
          </div>
        </div>
        <div id="events-list"></div>
      </section>

      <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="ping"><span>💌</span>Ping</button>
        <button class="nav-btn" data-tab="history"><span>🕰️</span>History</button>
        <button class="nav-btn" data-tab="dates"><span>💞</span>Us</button>
        <button class="nav-btn" data-tab="ask"><span>💭</span>Ask</button>
        <button class="nav-btn" data-tab="places"><span>📍</span>Places</button>
        <button class="nav-btn" data-tab="meet"><span>✈️</span>Meet</button>
      </nav>
    </main>
  </div>

  <div id="status" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
