name: Scheduled checks

# Wakes the app every 30 minutes so it can send milestone alerts, question
# reminders and countdown reminders even when nobody has the app open.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run the app's scheduled checks
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            https://notiapp-iz1e.onrender.com/api/cron/check
